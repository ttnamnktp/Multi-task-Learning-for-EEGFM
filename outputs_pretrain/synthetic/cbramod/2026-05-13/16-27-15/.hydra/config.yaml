seed: 42
module:
  name: cbramod_pretrain_module
data:
  batch_size: 8
  num_workers: 4
trainer:
  max_epochs: 5
  accelerator: auto
  devices: 1
  precision: 32
optimizer:
  name: adamw
  lr: 0.0001
  weight_decay: 0.01
scheduler:
  name: cosine
dataset:
  name: synthetic
  num_channels: 15
  seq_len: 1000
  num_classes: 4
  train_samples: 512
  val_samples: 128
  test_samples: 128
  synthetic:
    name: synthetic
model:
  name: cbramod
  variant: base
weighting:
  name: static
  params:
    weights:
      loss1: 1.0
      loss2: 1.0
