defaults:
  - _self_
  - dataset: synthetic/v2
  - model: eegpt/downstream
  - module: classification_module
  - hydra: default
  
seed: 42

data:
  batch_size: 64
  num_workers: 4

trainer:
  max_epochs: 50
  accelerator: auto
  devices: 1
  precision: 32

optimizer:
  name: adamw
  encoder_lr: 0.000001
  head_lr: 0.001
  adapter_lr: 0.001
  weight_decay: 0.01

scheduler:
  name: cosine